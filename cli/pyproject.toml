[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcecode"
version = "0.1.0"
description = "TCE Code — Institutional AI Coding Agent"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.scripts]
tcecode = "tcecode.main:main"

[tool.hatch.build.targets.wheel]
packages = ["tcecode"]
