name: tce-ai-gateway

networks:
  public:
  internal:

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  postgres_keycloak_data:

services:

  # ─── Reverse Proxy ──────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.6
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - ./traefik:/certs:ro
    networks:
      - public
      - internal
    restart: always
    labels:
      - "traefik.enable=true"
      # Dashboard restrito à rede interna
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=internal-only@file"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── AI Gateway ─────────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - internal
      - public   # egress para providers externos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"

      # ── Rota pública: /v1/ (API OpenAI-compatible) ──────────────────────────
      - "traefik.http.routers.litellm-api.rule=PathPrefix(`/v1/`)"
      - "traefik.http.routers.litellm-api.entrypoints=websecure"
      - "traefik.http.routers.litellm-api.tls=true"
      - "traefik.http.routers.litellm-api.middlewares=rate-limit@file,secure-headers@file"
      - "traefik.http.routers.litellm-api.priority=10"
      - "traefik.http.routers.litellm-api.service=litellm"

      # ── Bloquear endpoints admin (retorna 403 via middleware internal-only) ──
      - "traefik.http.routers.litellm-admin-block.rule=PathPrefix(`/v1/key`) || PathPrefix(`/v1/team`) || PathPrefix(`/v1/user`) || PathPrefix(`/v1/spend`) || PathPrefix(`/v1/model`) && !Path(`/v1/models`)"
      - "traefik.http.routers.litellm-admin-block.entrypoints=websecure"
      - "traefik.http.routers.litellm-admin-block.tls=true"
      - "traefik.http.routers.litellm-admin-block.middlewares=internal-only@file"
      - "traefik.http.routers.litellm-admin-block.priority=20"
      - "traefik.http.routers.litellm-admin-block.service=litellm"

      # ── Admin API (sem prefixo /admin/) ─────────────────────────────────────
      - "traefik.http.routers.litellm-admin.rule=PathPrefix(`/`)"
      - "traefik.http.routers.litellm-admin.entrypoints=websecure"
      - "traefik.http.routers.litellm-admin.tls=true"
      - "traefik.http.routers.litellm-admin.middlewares=internal-only@file"
      - "traefik.http.routers.litellm-admin.priority=1"
      - "traefik.http.routers.litellm-admin.service=litellm"

      # ── Health público ───────────────────────────────────────────────────────
      - "traefik.http.routers.litellm-health.rule=Path(`/health`)"
      - "traefik.http.routers.litellm-health.entrypoints=websecure"
      - "traefik.http.routers.litellm-health.tls=true"
      - "traefik.http.routers.litellm-health.priority=30"
      - "traefik.http.routers.litellm-health.middlewares=health-rewrite@file"
      - "traefik.http.routers.litellm-health.service=litellm-health-svc"
      - "traefik.http.services.litellm-health-svc.loadbalancer.server.port=4000"

      - "traefik.http.services.litellm.loadbalancer.server.port=4000"

  # ─── Banco de dados ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache / Rate Limiting ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Métricas ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ─── Dashboards ──────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://localhost/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.routers.grafana.middlewares=internal-only@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ─── Identity Provider ───────────────────────────────────────────────────────
  postgres-keycloak:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./keycloak/realm-tce-ai.json:/opt/keycloak/data/import/realm-tce-ai.json:ro
    networks:
      - internal
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    labels:
      - "traefik.enable=true"
      # OIDC protocol endpoints — públicos para tcecode login
      - "traefik.http.routers.keycloak-oidc.rule=PathPrefix(`/auth/realms/tce-ai/protocol`)"
      - "traefik.http.routers.keycloak-oidc.entrypoints=websecure"
      - "traefik.http.routers.keycloak-oidc.tls=true"
      - "traefik.http.routers.keycloak-oidc.middlewares=rate-limit@file"
      - "traefik.http.routers.keycloak-oidc.priority=50"
      - "traefik.http.routers.keycloak-oidc.service=keycloak"
      # Admin console — acesso interno apenas
      - "traefik.http.routers.keycloak-admin.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.keycloak-admin.entrypoints=websecure"
      - "traefik.http.routers.keycloak-admin.tls=true"
      - "traefik.http.routers.keycloak-admin.middlewares=internal-only@file"
      - "traefik.http.routers.keycloak-admin.priority=40"
      - "traefik.http.routers.keycloak-admin.service=keycloak"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
