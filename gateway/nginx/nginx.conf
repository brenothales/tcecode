worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json;

    upstream litellm {
        server litellm:4000;
        keepalive 32;
    }

    upstream grafana {
        server grafana:3000;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    server {
        listen 80;
        listen 443 ssl;
        ssl_certificate /etc/nginx/certs/tce-ai.crt;
        ssl_certificate_key /etc/nginx/certs/tce-ai.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name _;

        # Endpoints admin do LiteLLM — bloqueados externamente
        # /v1/model (singular, admin) bloqueado; /v1/models (plural, OpenAI) liberado
        location ~ ^/v1/(key|team|user|spend|model(/|$)|health/readiness) {
            return 403;
        }

        # AI Gateway — OpenAI-compatible API
        location /v1/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://litellm;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Admin API — acesso restrito (apenas rede interna)
        location /admin/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://litellm;
            proxy_set_header Host $host;
        }

        # Grafana
        location /grafana/ {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;

            proxy_pass http://grafana/grafana/;
            proxy_set_header Host $host;
        }

        # Health público
        location = /health {
            proxy_pass http://litellm/health/liveliness;
            access_log off;
        }
    }
}
