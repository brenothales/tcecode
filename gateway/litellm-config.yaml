# AI Gateway — LiteLLM Proxy Configuration
# ATENÇÃO: este arquivo NÃO contém secrets.
# API keys são injetadas via variáveis de ambiente (Kubernetes Secrets / Vault).

model_list:

  - model_name: institutional-coding
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Modelo institucional primário para desenvolvimento de software"
      max_tokens: 8192

  - model_name: institutional-reasoning
    litellm_params:
      model: openai/o3
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "Raciocínio complexo, debugging difícil, decisões arquiteturais"

  - model_name: institutional-fast
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Tarefas simples, respostas rápidas"

  # Descomentar quando Ollama disponível
  # - model_name: institutional-local
  #   litellm_params:
  #     model: ollama/qwen2.5-coder:32b
  #     api_base: "${OLLAMA_BASE_URL:-http://ollama:11434}"

router_settings:
  routing_strategy: usage-based-routing
  num_retries: 2
  timeout: 120
  fallbacks:
    - {"institutional-coding": ["institutional-fast"]}
    - {"institutional-reasoning": ["institutional-coding"]}

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true
  callbacks: ["prometheus"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  redis_host: redis
  redis_port: 6379
  max_parallel_requests: 100
  health_check_interval: 300
  cache_params:
    type: redis
    supported_call_types: []
