# Build + publish dos binários do tcecode-agent (fork institucional do OpenCode).
#
# Dispara em tags "agent-v*" (ex: agent-v1.0.0). Builda todas as plataformas
# suportadas num único runner Linux — o `bun build --compile` faz cross-compile
# sem precisar de macOS/Windows nativos (ver opencode/packages/opencode/script/build.ts).
#
# Setup necessário no repositório Bitbucket (Repository settings > Repository variables):
#   BB_DOWNLOADS_USER          - usuário Bitbucket com permissão de escrita no repo
#   BB_DOWNLOADS_APP_PASSWORD  - App Password (escopo "Repositories: Write"), marcada Secured
#
# O fork (brenothales/opencode, branch dev) é clonado via HTTPS público do GitHub.
# Se o fork migrar para o Bitbucket institucional, trocar a URL do clone abaixo.

image: oven/bun:1.3.14

definitions:
  steps:
    - step: &build-and-publish
        name: Build tcecode-agent (todas as plataformas) e publicar no Bitbucket Downloads
        size: 2x
        script:
          - apt-get update -qq && apt-get install -y -qq git curl zip tar > /dev/null
          - git clone --branch dev --depth 1 https://github.com/brenothales/opencode.git /tmp/opencode-fork
          - cd /tmp/opencode-fork/packages/opencode
          - bun install
          - bun run script/build.ts --skip-embed-web-ui
          - |
            set -euo pipefail
            for dist_dir in dist/*/; do
              name=$(basename "$dist_dir")
              bin_dir="${dist_dir}bin"
              if [ -f "${bin_dir}/tcecode-agent.exe" ]; then
                asset="/tmp/${name}.zip"
                (cd "$bin_dir" && zip -q "$asset" tcecode-agent.exe)
              elif [ -f "${bin_dir}/tcecode-agent" ]; then
                asset="/tmp/${name}.tar.gz"
                (cd "$bin_dir" && tar -czf "$asset" tcecode-agent)
              else
                echo "Aviso: nenhum binário encontrado em ${bin_dir}, pulando ${name}"
                continue
              fi
              echo "Publicando ${asset}..."
              curl --fail -X POST \
                "https://api.bitbucket.org/2.0/repositories/${BITBUCKET_WORKSPACE}/${BITBUCKET_REPO_SLUG}/downloads" \
                -u "${BB_DOWNLOADS_USER}:${BB_DOWNLOADS_APP_PASSWORD}" \
                -F "files=@${asset}"
            done

pipelines:
  tags:
    'agent-v*':
      - step: *build-and-publish
  custom:
    build-agent-manual:
      - step: *build-and-publish
