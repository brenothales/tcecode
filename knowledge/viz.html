stalar o `tcecode` exigia passos manuais: `pipx install -e cli/`, clonar o fork do OpenCode, instalar Bun, buildar localmente. Isso n\u00e3o escala para squads inteiras sem documenta\u00e7\u00e3o. O padr\u00e3o de mercado \u00e9 um instalador one-liner (`curl -fsSL <url>/install | bash`, como o pr\u00f3prio `opencode.ai` usa).\n\nO reposit\u00f3rio institucional vive no Bitbucket (`git@bitbucket.org:tcesc-git/tcecode.git`). O `cli/tcecode/agent.py` resolve o caminho do fork buildado (`_FORK_BIN`) **relativo ao pr\u00f3prio clone do reposit\u00f3rio** (`Path(__file__).parent.parent.parent / \"opencode\" / ...`) \u2014 isso s\u00f3 funciona com uma instala\u00e7\u00e3o edit\u00e1vel (`pipx install -e`) a partir de um clone persistente, n\u00e3o com um pacote solto instalado via pip/PyPI.\n\n## Decis\u00e3o\n\n**`scripts/install.sh`** (Linux/macOS) e **`scripts/install.ps1`** (Windows) fazem tudo localmente, sem depender de nenhum artefato pr\u00e9-buildado:\n\n1. Clonam (ou atualizam) o repo `tcecode` em `~/.local/share/tcecode-src` (Linux/macOS) ou `%LOCALAPPDATA%\\tcecode-src` (Windows).\n2. Clonam o fork `brenothales/opencode` (branch `dev`) dentro desse clone, em `opencode/` \u2014 path esperado pelo `agent.py`.\n3. Instalam Bun se necess\u00e1rio, buildam o `tcecode-agent` (`bun run script/build.ts --single --skip-embed-web-ui`).\n4. Instalam o CLI via `pipx install -e <clone>/cli` (edit\u00e1vel, pra manter a resolu\u00e7\u00e3o de path do fork funcionando).\n5. Rodam `tcecode update`, que j\u00e1 encontra o bin\u00e1rio buildado em `_FORK_BIN` e vincula.\n\nPreferem SSH (`git@bitbucket.org`) quando configurado, caem para HTTPS com aviso caso contr\u00e1rio \u2014 mesma l\u00f3gica para o fork no GitHub.\n\n## Alternativa descartada: bin\u00e1rios pr\u00e9-buildados via CI\n\nUma primeira vers\u00e3o publicava bin\u00e1rios pr\u00e9-buildados (Bitbucket Pipelines, disparado em tags `agent-v*`, build cross-platform via `bun build --compile`, upload para Bitbucket Downloads via Repository Access Token). Descartada porque:\n\n- Adicionava uma pe\u00e7a de infra extra (pipeline + token + vari\u00e1vel secured) para um ganho que n\u00e3o valia a complexidade neste est\u00e1gio do projeto \u2014 o objetivo era o dev rodar um comando, n\u00e3o manter um pipeline de release.\n- O build local (~2-3 min, majoritariamente `bun install`) \u00e9 aceit\u00e1vel para instala\u00e7\u00e3o \u00fanica por m\u00e1quina.\n\nSe o tempo de build virar um problema real (squads grandes, m\u00e1quinas lentas), vale reconsiderar \u2014 o pipeline descartado fica como refer\u00eancia no hist\u00f3rico do git (commit anterior a este ADR).\n\n## Consequ\u00eancias\n\n**Positivo:**\n- Instala\u00e7\u00e3o de squad inteira em um comando, sem passos manuais documentados \u00e0 parte.\n- Sem infraestrutura de CI/credenciais extra para manter.\n\n**Trade-offs / pend\u00eancias:**\n- **Reposit\u00f3rio privado**: se `tcesc-git/tcecode` n\u00e3o for p\u00fablico, `git clone`/`pipx install` exigem credenciais (SSH configurado ou HTTPS com prompt). Os scripts tentam SSH primeiro e avisam se cair para HTTPS.\n- **Tempo de instala\u00e7\u00e3o**: build local do fork (~2-3 min na primeira vez, incluindo `bun install` do monorepo inteiro) \u2014 n\u00e3o \u00e9 instant\u00e2neo como baixar um bin\u00e1rio pronto.\n- **Windows nativo**: `AGENT_BIN` em `config.py` n\u00e3o distingue `.exe`; suporte Windows do `tcecode` CLI em si \u00e9 best-effort, n\u00e3o validado numa m\u00e1quina Windows real.\n- **N\u00e3o testado**: scripts escritos e revisados, mas n\u00e3o executados de ponta a ponta numa m\u00e1quina limpa nem no Bitbucket institucional real.\n\n## Refer\u00eancias\n\n- [cli/tcecode/agent.py](/cli/tcecode/agent.py)\n- [scripts/install.sh](/scripts/install.sh)\n- [scripts/install.ps1](/scripts/install.ps1)\n- [adr-009-fork-opencode](/decisions/adr-009-fork-opencode.md)", "development/okf-mermaid-setup": "# Habilitar Mermaid no Viewer OKF\n\nO viewer OKF (`viz.html`) usa `marked` para renderizar o corpo dos concepts em Markdown.\nPor padr\u00e3o, blocos ` ```mermaid ` s\u00e3o exibidos como c\u00f3digo puro \u2014 n\u00e3o renderizados.\n\nEste runbook aplica o patch que ativa a renderiza\u00e7\u00e3o via [Mermaid.js](https://mermaid.js.org).\n\n---\n\n## Pr\u00e9-requisitos\n\n- Skill OKF instalada em `~/.claude/skills/okf/vendor/knowledge-catalog/okf/`\n- Python 3 dispon\u00edvel no PATH\n\n---\n\n## Op\u00e7\u00e3o 1 \u2014 Script automatizado (recomendado)\n\nNa raiz do repo `tcecode`:\n\n```bash\nbash scripts/patch-okf-mermaid.sh\n./viz.sh\n```\n\nO script \u00e9 idempotente: pode ser rodado m\u00faltiplas vezes sem duplicar o patch.\n\n---\n\n## Op\u00e7\u00e3o 2 \u2014 Manual (para outros agentes ou m\u00e1quinas)\n\n### Passo 1 \u2014 Adicionar script Mermaid ao template HTML\n\nArquivo: `~/.claude/skills/okf/vendor/knowledge-catalog/okf/src/reference_agent/viewer/templates/viz.html`\n\nAp\u00f3s a linha com `marked.min.js`, adicionar:\n\n```html\n<script src=\"https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js\"><\/script>\n```\n\n### Passo 2 \u2014 Adicionar renderiza\u00e7\u00e3o ao viz.js\n\nArquivo: `~/.claude/skills/okf/vendor/knowledge-catalog/okf/src/reference_agent/viewer/static/viz.js`\n\nLocalizar o bloco:\n```js\n    rewriteInternalLinks(bodyEl);\n```\n\nAdicionar imediatamente ap\u00f3s:\n```js\n    // render mermaid diagrams inside the detail panel\n    bodyEl.querySelectorAll(\"pre code.language-mermaid\").forEach((el) => {\n      const src = el.textContent || \"\";\n      const wrapper = document.createElement(\"div\");\n      wrapper.className = \"mermaid\";\n      wrapper.textContent = src;\n      el.parentElement.replaceWith(wrapper);\n    });\n    if (bodyEl.querySelector(\".mermaid\")) {\n      const theme = document.documentElement.dataset.theme === \"dark\" ? \"dark\" : \"default\";\n      mermaid.initialize({ startOnLoad: false, theme });\n      mermaid.run({ nodes: bodyEl.querySelectorAll(\".mermaid\") });\n    }\n```\n\n### Passo 3 \u2014 Regenerar o viz.html\n\n```bash\n./viz.sh\n```\n\n---\n\n## Como usar nos concepts OKF\n\nEm qualquer arquivo `.md` do bundle, adicione um bloco mermaid:\n\n```markdown\n```mermaid\ngraph TD\n    A[Componente A] --> B[Componente B]\n    B --> C[Componente C]\n```\n```\n\nAo clicar no concept no grafo, o diagrama ser\u00e1 renderizado automaticamente,\nrespeitando o tema claro/escuro da interface.\n\n---\n\n## Contexto da implementa\u00e7\u00e3o\n\nAplicado pela primeira vez no bundle `tce-ai-platform` em 2026-08-10.\nO patch foi necess\u00e1rio porque o viewer original n\u00e3o inclui suporte a Mermaid.\nA abordagem: `marked` converte ` ```mermaid ` em `<pre><code class=\"language-mermaid\">`,\ne o patch substitui esses elementos por `<div class=\"mermaid\">` antes de chamar `mermaid.run()`.\n\n## Relacionamentos\n\n- [phases-roadmap](/development/phases-roadmap.md)\n- [quality-gate](/development/quality-gate.md)", "development/phases-roadmap": "# Roadmap de Implementa\u00e7\u00e3o\n\n## Fase 1 \u2014 Foundation \u2705 Conclu\u00edda (2026-08-10)\n\n```\ntcecode CLI (Python/Typer)\n+ OpenCode (engine interno, sem fork)\n+ LiteLLM Proxy (AI Gateway)\n+ Nginx (reverse proxy + TLS)\n+ Redis (rate limiting)\n+ Postgres (quotas/audit)\n+ Prometheus + Grafana\n+ Virtual keys por squad\n```\n\n**Validado:** fluxo `tcecode \u2192 OpenCode \u2192 Nginx \u2192 LiteLLM \u2192 OpenAI` funcionando end-to-end.\n\n**Fork implementado (ADR-009):** branding resolvido \u2014 `tcecode-agent` com logo TCE CODE, epilogue correto, auto-update desabilitado. ADR-006 supersedido.\n\n**Providers ativos:**\n- `institutional-reasoning` \u2192 OpenAI \u2705\n- `institutional-coding` \u2192 Anthropic \u274c (sem cr\u00e9dito)\n- `institutional-fast` \u2192 Gemini \u274c (free tier esgotado)\n\n---\n\n## Fase 2 \u2014 Identity \u2705 Conclu\u00edda (2026-08-10)\n\n```\nKeycloak 26.0 + OIDC (ROPC Grant)\n+ JWT institucional com squad + roles\n+ tcecode login/logout/status\n+ Token refresh autom\u00e1tico (30s buffer)\n+ Keycloak roteado via Traefik file provider\n```\n\n**Stack:** postgres-keycloak + keycloak + realm tce-ai + cliente tcecode-cli\n\n**Separa\u00e7\u00e3o de responsabilidades:**\n- JWT = identidade do desenvolvedor no tcecode (quem est\u00e1 usando, rastreabilidade)\n- Virtual key = credencial de acesso ao LiteLLM (por squad \u2014 mantida da Fase 1)\n\n**Limita\u00e7\u00e3o conhecida:** LiteLLM JWT auth (`enable_jwt_auth`) \u00e9 feature enterprise-only.\n**Fork implementado (ADR-009):** `tcecode-agent` com branding TCE CODE. Build: `bun run script/build.ts --single --skip-embed-web-ui`.\nCaminho para Fase 3: middleware Traefik (ForwardAuth) valida JWT e injeta virtual key do squad.\n\n**Providers ativos:**\n- `institutional-reasoning` \u2192 OpenAI \u2705\n- `institutional-coding` \u2192 Anthropic \u274c (sem cr\u00e9dito)\n- `institutional-fast` \u2192 Gemini \u274c (free tier esgotado)\n\n---\n\n## Fase 3 \u2014 Institutional Knowledge\n\n```\nSkills institucionais completas (20+ tecnologias)\n+ AGENTS.md global e por squad\n+ .okf/ integrado ao tcecode (leitura autom\u00e1tica de contexto)\n+ Template de novo projeto (Spring Boot + observabilidade + security)\n+ tcecode new-project <nome>\n```\n\n---\n\n## Fase 4 \u2014 Institutional Tools (MCP)\n\n```\nMCP Server: GitLab\nMCP Server: Jira\nMCP Server: Kubernetes\nMCP Server: OpenSearch\nMCP Server: Grafana / Logs\nMCP Server: CI/CD\nMCP Server: Service Catalog\n```\n\n---\n\n## Fase 5 \u2014 Agent Ecosystem (A2A)\n\n```\nArchitecture Agent\nSecurity Agent\nDevOps Agent\nDatabase Agent\nTesting Agent\nDocumentation Agent\n```\n\nReavalia\u00e7\u00e3o de fork do OpenCode nesta fase se necess\u00e1rio.\n\n---\n\n## Fase 6 \u2014 Governance\n\n```\nAudit logs completos com OpenTelemetry\n+ Cost reports por squad/projeto/m\u00eas\n+ Quota enforcement com alertas\n+ AI Governance policies (LGPD, uso respons\u00e1vel)\n+ Compliance reports\n+ Vault para rota\u00e7\u00e3o autom\u00e1tica de secrets\n```\n\n## Relacionamentos\n\n- [overview](/architecture/overview.md)\n- [adr-001-stack](/decisions/adr-001-stack.md)\n- [adr-006-branding](/decisions/adr-006-branding.md)", "development/quality-gate": "# Quality Gate do Agente\n\nAntes de considerar uma implementa\u00e7\u00e3o conclu\u00edda, o agente verifica:\n\n## C\u00f3digo\n\n- [ ] Compila sem erros\n- [ ] Nenhum warning n\u00e3o justificado\n- [ ] Arquitetura adequada (Hexagonal/Clean quando aplic\u00e1vel, sem l\u00f3gica em controller)\n- [ ] SOLID respeitado\n- [ ] Sem depend\u00eancias circulares\n\n## Testes\n\n- [ ] Testes unit\u00e1rios para comportamento relevante\n- [ ] Testes de integra\u00e7\u00e3o para adapters/infra\n- [ ] Todos os testes passam\n- [ ] Cobertura razo\u00e1vel (sem obsess\u00e3o por percentual \u2014 cobertura de comportamento, n\u00e3o de linhas)\n\n## Seguran\u00e7a\n\n- [ ] Nenhum secret hardcoded (API key, password, connection string)\n- [ ] Valida\u00e7\u00e3o de entrada nos boundaries do sistema\n- [ ] Sem SQL injection, command injection, XSS\n- [ ] Princ\u00edpio do menor privil\u00e9gio respeitado\n- [ ] Logs n\u00e3o cont\u00eam dados sens\u00edveis\n\n## Observabilidade\n\n- [ ] Logs estruturados (JSON) com n\u00edvel adequado\n- [ ] M\u00e9tricas relevantes instrumentadas (se aplic\u00e1vel)\n- [ ] Trace propagado (se aplic\u00e1vel)\n- [ ] Health endpoint presente (se servi\u00e7o)\n\n## Depend\u00eancias\n\n- [ ] Nenhuma depend\u00eancia nova sem justificativa\n- [ ] Depend\u00eancias verificadas quanto a vulnerabilidades conhecidas\n\n## Documenta\u00e7\u00e3o\n\n- [ ] README atualizado se comportamento externo mudou\n- [ ] OpenAPI atualizado se endpoint mudou\n- [ ] ADR criado se decis\u00e3o arquitetural relevante foi tomada\n\n## OKF\n\n- [ ] `.okf/` atualizado se houver novo conhecimento permanente relevante\n- [ ] Nenhum secret no OKF\n\n## Git\n\n- [ ] Git diff revisado antes de commit\n- [ ] Commit message descritiva\n- [ ] Nenhum arquivo desnecess\u00e1rio inclu\u00eddo (.env, *.secret, etc.)\n\n---\n\nO agente n\u00e3o marca a tarefa como conclu\u00edda sem passar por este checklist.\nPara tarefas simples (refatora\u00e7\u00f5es cosm\u00e9ticas, renomea\u00e7\u00f5es), verifica\u00e7\u00f5es de arquitetura e OKF podem ser puladas.\n\n## Relacionamentos\n\n- [overview](/architecture/overview.md)\n- [security-model](/architecture/security-model.md)", "patterns/agent-loop": "# Agent Loop\n\nPadr\u00e3o central de execu\u00e7\u00e3o do TCE Agent. O agente opera em ciclos at\u00e9 decidir que a tarefa est\u00e1 conclu\u00edda ou atingir o limite de itera\u00e7\u00f5es.\n\n## Pseudoc\u00f3digo\n\n```python\nwhile not done and iterations < MAX_ITER:\n    response = llm.complete(messages + tool_results)\n    if response.has_tool_call:\n        result = tools.execute(response.tool_call)\n        messages.append(tool_result(result))\n    else:\n        done = True\n        output(response.text)\n```\n\n## Considera\u00e7\u00f5es\n\n- Limite de itera\u00e7\u00f5es evita loops infinitos em caso de falha de ferramenta.\n- Cada tool_result \u00e9 adicionado ao contexto acumulado \u2014 custo de tokens cresce por ciclo.\n- Ferramentas destrutivas (write_file, run_command) devem ter confirma\u00e7\u00e3o expl\u00edcita do usu\u00e1rio.\n\n## Relacionamentos\n\n- [tce-agent](/agents/tce-agent.md)\n- [overview](/architecture/overview.md)"}, "types": ["Architecture Pattern", "Decision", "Runbook", "Service"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981", "Service": "#2563EB", "Architecture Pattern": "#0891B2", "Bug Report": "#ef4444", "Runbook": "#84cc16", "API Endpoint": "#f97316", "Decision": "#7C3AED", "Metric": "#f59e0b", "Policy": "#d946ef", "Attested Computation": "#14b8a6", "Skill": "#22c55e", "Log": "#06b6d4", "index": "#6B7280", "architecture": "#2563EB", "decision": "#7C3AED", "development": "#059669", "agents": "#D97706", "patterns": "#0891B2", "domains": "#BE185D"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;
  document.getElementById("bundle-stats").textContent =
    `${bundle.nodes.length} concept${bundle.nodes.length === 1 ? "" : "s"} · ${bundle.edges.length} link${bundle.edges.length === 1 ? "" : "s"}`;

  // Resolved color per type (from actual node data, so it always matches
  // what the generator picked — including its fallback for unknown types —
  // rather than trusting bundle.palette to have every key).
  const typeColor = {};
  for (const n of bundle.nodes) {
    if (!(n.data.type in typeColor)) typeColor[n.data.type] = n.data.color;
  }

  // Count per type for chip badges
  const typeCount = {};
  for (const n of bundle.nodes) {
    typeCount[n.data.type] = (typeCount[n.data.type] || 0) + 1;
  }

  // Build reverse-link index (backlinks) and forward-link index
  const backlinks = {};
  const forwardlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
    (forwardlinks[source] ||= []).push(target);
  }

  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  function cssVar(name, fallback) {
    const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }

  const SELECTED_COLOR = "#f59e0b";

  function buildCyStyle() {
    const text = cssVar("--text", "#18181b");
    const edgeColor = cssVar("--border-strong", "#d4d4d8");
    return [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": text,
          "font-family": '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
          "font-size": 11,
          "font-weight": 500,
          "text-valign": "bottom",
          "text-margin-y": 6,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 2,
          "border-color": "data(color)",
          "border-opacity": 0.35,
          "shadow-blur": 12,
          "shadow-color": "rgba(15, 15, 20, 0.28)",
          "shadow-opacity": 0.45,
          "shadow-offset-x": 0,
          "shadow-offset-y": 1,
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#ef4444",
          "border-opacity": 0.9,
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: { "opacity": 0.5 },
      },
      {
        selector: "node.hovered",
        style: { "border-opacity": 0.9, "border-width": 3 },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": SELECTED_COLOR,
          "border-opacity": 1,
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.4,
          "line-color": edgeColor,
          "target-arrow-color": edgeColor,
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.85,
          "opacity": 0.75,
        },
      },
      {
        selector: "edge.hovered",
        style: {
          "line-color": SELECTED_COLOR,
          "target-arrow-color": SELECTED_COLOR,
          "width": 2,
          "opacity": 1,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": SELECTED_COLOR,
          "target-arrow-color": SELECTED_COLOR,
          "width": 2.2,
          "opacity": 1,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.12 },
      },
    ];
  }

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: buildCyStyle(),
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });
  cy.on("mouseover", "node", (evt) => evt.target.addClass("hovered"));
  cy.on("mouseout", "node", (evt) => evt.target.removeClass("hovered"));

  // --- Edge hover tooltip ---
  const edgeTooltip = document.getElementById("edge-tooltip");
  let tooltipActive = false;
  cy.on("mouseover", "edge", (evt) => {
    const edge = evt.target;
    edge.addClass("hovered");
    const srcLabel = nodeIndex[edge.data("source")]?.label || edge.data("source");
    const tgtLabel = nodeIndex[edge.data("target")]?.label || edge.data("target");
    edgeTooltip.textContent = `${srcLabel} → ${tgtLabel}`;
    edgeTooltip.hidden = false;
    tooltipActive = true;
  });
  cy.on("mouseout", "edge", (evt) => {
    evt.target.removeClass("hovered");
    edgeTooltip.hidden = true;
    tooltipActive = false;
  });
  document.getElementById("graph").addEventListener("mousemove", (e) => {
    if (!tooltipActive) return;
    edgeTooltip.style.left = `${e.clientX + 14}px`;
    edgeTooltip.style.top = `${e.clientY - 36}px`;
  });

  function reapplyGraphTheme() {
    cy.style(buildCyStyle()).update();
  }
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    (mq.addEventListener ? mq.addEventListener.bind(mq) : mq.addListener.bind(mq))("change", reapplyGraphTheme);
  }
  new MutationObserver(reapplyGraphTheme).observe(document.documentElement, {
    attributes: true,
    attributeFilter: ["data-theme"],
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  // --- Filtering ---
  let activeType = null;

  function applyFilters() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    cy.nodes().forEach((n) => {
      const d = n.data();
      const matchesQuery =
        !q ||
        (d.label || "").toLowerCase().includes(q) ||
        d.id.toLowerCase().includes(q) ||
        (d.tags || []).join(" ").toLowerCase().includes(q);
      const matchesType = !activeType || d.type === activeType;
      n.toggleClass("dim", !(matchesQuery && matchesType));
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  }

  document.getElementById("search").addEventListener("input", applyFilters);

  function resetFilters() {
    activeType = null;
    document.getElementById("search").value = "";
    document.querySelectorAll(".legend-chip").forEach((el) =>
      el.setAttribute("aria-pressed", "false")
    );
    applyFilters();
  }

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    resetFilters();
    clearSelection();
  });

  function renderLegend() {
    const legend = document.getElementById("legend");
    legend.innerHTML = "";
    for (const t of bundle.types) {
      const color = typeColor[t] || "#94a3b8";
      const count = typeCount[t] || 0;
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "legend-chip";
      chip.dataset.type = t;
      chip.setAttribute("aria-pressed", "false");
      chip.title = `Filter by ${t}`;
      chip.style.setProperty("--chip-color", color);
      chip.style.setProperty("--chip-soft", `color-mix(in srgb, ${color} 18%, var(--surface))`);

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.style.background = color;
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(t));

      const countBadge = document.createElement("span");
      countBadge.className = "chip-count";
      countBadge.textContent = count;
      chip.appendChild(countBadge);

      chip.addEventListener("click", () => {
        activeType = activeType === t ? null : t;
        for (const el of legend.children) {
          el.setAttribute("aria-pressed", String(el.dataset.type === activeType));
        }
        applyFilters();
      });
      legend.appendChild(chip);
    }
  }
  renderLegend();

  // --- Detail panel ---
  const detailPanel = document.getElementById("detail");
  const resizeHandleEl = document.getElementById("resize-handle");

  // Navigation history
  const navHistory = [];
  let navCursor = -1;
  let currentNodeId = null;

  function updateNavButtons() {
    document.getElementById("nav-back").disabled = navCursor <= 0;
    document.getElementById("nav-fwd").disabled = navCursor >= navHistory.length - 1;
  }

  function setDetailOpen(open) {
    if (!open) detailPanel.style.flexBasis = "";
    detailPanel.classList.toggle("detail-open", open);
    resizeHandleEl.classList.toggle("detail-hidden", !open);
  }

  function clearSelection() {
    cy.elements().unselect();
    setDetailOpen(false);
    edgeTooltip.hidden = true;
    tooltipActive = false;
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId, fromNav = false) {
    const data = nodeIndex[conceptId];
    if (!data) return;

    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    if (!fromNav) {
      navHistory.splice(navCursor + 1);
      navHistory.push(conceptId);
      navCursor = navHistory.length - 1;
    }
    currentNodeId = conceptId;
    updateNavButtons();

    setDetailOpen(true);
    document.getElementById("detail-empty").hidden = true;
    document.getElementById("detail-content").hidden = false;

    const typeChip = document.getElementById("detail-type");
    typeChip.textContent = data.type;
    typeChip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    verifiedEl.textContent = verified.length ? verified.map(formatActorEvent).join("; ") : "—";

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);
    // render mermaid diagrams inside the detail panel
    bodyEl.querySelectorAll("pre code.language-mermaid").forEach((el) => {
      const src = el.textContent || "";
      const wrapper = document.createElement("div");
      wrapper.className = "mermaid";
      wrapper.textContent = src;
      el.parentElement.replaceWith(wrapper);
    });
    if (bodyEl.querySelector(".mermaid")) {
      const theme = document.documentElement.dataset.theme === "dark" ? "dark" : "default";
      mermaid.initialize({ startOnLoad: false, theme });
      mermaid.run({ nodes: bodyEl.querySelectorAll(".mermaid") });
    }

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // --- Detail panel controls ---
  document.getElementById("detail-close").addEventListener("click", clearSelection);

  document.getElementById("nav-back").addEventListener("click", () => {
    if (navCursor > 0) { navCursor--; showDetail(navHistory[navCursor], true); }
  });
  document.getElementById("nav-fwd").addEventListener("click", () => {
    if (navCursor < navHistory.length - 1) { navCursor++; showDetail(navHistory[navCursor], true); }
  });

  // --- Keyboard shortcuts ---
  document.addEventListener("keydown", (e) => {
    const panelOpen = detailPanel.classList.contains("detail-open");
    const inputFocused = document.activeElement &&
      (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT");

    if (e.key === "Escape" && panelOpen) { clearSelection(); return; }
    if (!panelOpen || inputFocused) return;

    if (e.key === "ArrowLeft" && navCursor > 0) {
      navCursor--;
      showDetail(navHistory[navCursor], true);
      e.preventDefault();
    } else if (e.key === "ArrowRight" && navCursor < navHistory.length - 1) {
      navCursor++;
      showDetail(navHistory[navCursor], true);
      e.preventDefault();
    } else if ((e.key === "ArrowDown" || e.key === "ArrowUp") && currentNodeId) {
      // Cycle through neighbors (forward links + backlinks)
      const neighbors = [
        ...(forwardlinks[currentNodeId] || []),
        ...(backlinks[currentNodeId] || []),
      ].filter((id, i, arr) => id !== currentNodeId && arr.indexOf(id) === i);
      if (!neighbors.length) return;
      const curIdx = neighbors.indexOf(navHistory[navCursor]);
      const nextIdx = e.key === "ArrowDown"
        ? (curIdx + 1) % neighbors.length
        : (curIdx - 1 + neighbors.length) % neighbors.length;
      showDetail(neighbors[nextIdx]);
      e.preventDefault();
    }
  });

  // Panel starts hidden
  setDetailOpen(false);
  updateNavButtons();

  // --- Resizable detail panel ---
  (function () {
    const handle = resizeHandleEl;
    const detail = detailPanel;
    const mainEl = document.querySelector("main");
    if (!handle || !detail || !mainEl) return;
    let dragging = false;

    handle.addEventListener("mousedown", (e) => {
      if (!detail.classList.contains("detail-open")) return;
      dragging = true;
      handle.classList.add("dragging");
      document.body.style.cursor = "col-resize";
      document.body.style.userSelect = "none";
      e.preventDefault();
    });

    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const rect = mainEl.getBoundingClientRect();
      const offset = e.clientX - rect.left;
      const total = rect.width;
      const detailWidth = Math.max(180, Math.min(total * 0.8, total - offset - 5));
      detail.style.flexBasis = `${detailWidth}px`;
    });

    document.addEventListener("mouseup", () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove("dragging");
      document.body.style.cursor = "";
      document.body.style.userSelect = "";
    });
  })();
})();

</script>
</body>
</html>
